name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum stable peers
            node: 20.19.0
            angular: 21.0.0
            angular_build: 21.0.0
            angular_cli: 21.0.0
            angular_service_worker: 21.0.0
            ngrx: 21.0.0
            ng_packagr: 21.0.0
          - name: Current stable peers
            node: 22.12.0
            angular: 21.2.19
            angular_build: 21.2.20
            angular_cli: 21.2.20
            angular_service_worker: 21.2.19
            ngrx: 21.1.1
            ng_packagr: 21.2.7
          - name: Current peers on Node 24
            node: 24.0.0
            angular: 21.2.19
            angular_build: 21.2.20
            angular_cli: 21.2.20
            angular_service_worker: 21.2.19
            ngrx: 21.1.1
            ng_packagr: 21.2.7
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Select compatibility versions
        env:
          ANGULAR_VERSION: ${{ matrix.angular }}
          ANGULAR_BUILD_VERSION: ${{ matrix.angular_build }}
          ANGULAR_CLI_VERSION: ${{ matrix.angular_cli }}
          ANGULAR_SERVICE_WORKER_VERSION: ${{ matrix.angular_service_worker }}
          NGRX_VERSION: ${{ matrix.ngrx }}
          NG_PACKAGR_VERSION: ${{ matrix.ng_packagr }}
          PNPM_CONFIG_LOCKFILE: 'false'
        run: >-
          pnpm add --workspace-root --save-dev
          "@angular/build@$ANGULAR_BUILD_VERSION"
          "@angular/cli@$ANGULAR_CLI_VERSION"
          "@angular/common@$ANGULAR_VERSION"
          "@angular/compiler@$ANGULAR_VERSION"
          "@angular/compiler-cli@$ANGULAR_VERSION"
          "@angular/core@$ANGULAR_VERSION"
          "@angular/platform-browser@$ANGULAR_VERSION"
          "@angular/service-worker@$ANGULAR_SERVICE_WORKER_VERSION"
          "@ngrx/effects@$NGRX_VERSION"
          "@ngrx/store@$NGRX_VERSION"
          "ng-packagr@$NG_PACKAGR_VERSION"

      - name: Build package
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  browser:
    name: Foreground browser replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtimes
        run: pnpm exec playwright install --with-deps chrome msedge chromium firefox webkit

      - name: Run foreground browser coverage
        run: pnpm test:e2e
