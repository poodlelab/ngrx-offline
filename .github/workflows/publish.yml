name: Publish npm alpha

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: pnpm check

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          version="$(node -p "require('./dist/ngrx-offline/package.json').version")"
          package="@poodlelab/ngrx-offline@${version}"
          if published="$(npm view "$package" version 2>npm-view-error.log)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package is already published; skipping npm publish."
          elif grep -q 'E404' npm-view-error.log; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$package is not published yet."
          else
            cat npm-view-error.log
            exit 1
          fi

      - name: Publish alpha with provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish ./dist/ngrx-offline --access public --tag alpha
