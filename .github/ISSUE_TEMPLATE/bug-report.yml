name: Bug report
description: Report reproducible incorrect behavior.
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: Do not use this form for security vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a repository or provide exact reproduction steps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: NgRx Offline, Angular, NgRx, browser, and operating system versions.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant logs without operation payloads, secrets, or personal data.
