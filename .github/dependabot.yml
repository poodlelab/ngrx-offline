version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
          - 'ng-packagr'
      ngrx:
        patterns:
          - '@ngrx/*'
      development-tooling:
        dependency-type: development
        exclude-patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - '@ngrx/*'
          - 'angular-eslint'
          - 'ng-packagr'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
