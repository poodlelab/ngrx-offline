openapi: 3.1.0
info:
  title: NgRx Offline reference API
  version: 0.1.0
  summary: Travel-journal API for demonstrating durable relational offline mutations.
  description: |
    This API backs the NgRx Offline showcase. Domain mutations require a
    workspace-scoped idempotency key, creates use client UUIDs plus numeric
    server IDs, and updates use strong entity tags for optimistic concurrency.
  contact:
    name: NgRx Offline maintainers
    url: https://github.com/poodlelab/ngrx-offline
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{apiHost}/v1
    description: Deployed demo API
    variables:
      apiHost:
        default: ngrx-offline-demo-api.workers.dev
        description: Hostname selected during deployment.
  - url: http://localhost:8787/v1
    description: Local Wrangler development server
tags:
  - name: System
    description: Service health and version information.
  - name: Demo workspaces
    description: Anonymous capability-scoped workspace lifecycle.
  - name: Snapshot
    description: Consistent workspace data snapshots.
  - name: Trips
    description: Journeys at the root of the demo hierarchy.
  - name: TravelDays
    description: Dated journal chapters belonging to trips.
  - name: Place visits
    description: Locations recorded during a travel day.
  - name: Memories
    description: Ordered memories belonging to place visits.
  - name: Day reflections
    description: Evening reflections belonging directly to travel days.
  - name: Test controls
    description: Workspace-scoped deterministic failure behavior.
security:
  - demoWorkspace: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      tags: [System]
      security: []
      responses:
        '200':
          description: API is available.
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Health
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /version:
    get:
      operationId: getVersion
      summary: Get the deployed API version
      tags: [System]
      security: []
      responses:
        '200':
          description: Deployed API and Workers compatibility versions.
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/VersionInfo
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /demo-workspaces:
    post:
      operationId: registerDemoWorkspace
      summary: Register a client-generated demo workspace
      description: |
        Registration is idempotent for the same workspace UUID and secret. If
        the UUID already exists with another secret, the API returns 409.
      tags: [Demo workspaces]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.json#/$defs/RegisterWorkspaceRequest
      responses:
        '201':
          description: Workspace registered.
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Workspace
        '200':
          description: Existing workspace recovered with matching credentials.
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Workspace
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /demo-workspaces/reset:
    post:
      operationId: resetDemoWorkspace
      summary: Remove all domain data from the active workspace
      description: |
        Reset is administrative and idempotent. It deletes domain records,
        idempotency receipts, and armed test behaviors while retaining the
        workspace capability.
      tags: [Demo workspaces]
      responses:
        '200':
          description: Workspace reset.
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/WorkspaceReset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
