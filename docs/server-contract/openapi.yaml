      - $ref: '#/components/parameters/BehaviorIdempotencyKey'
    delete:
      operationId: clearTestBehavior
      summary: Disarm a deterministic operation behavior
      tags: [Test controls]
      responses:
        '204':
          description: Behavior absent or disarmed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /test-controls/diagnostics/{idempotencyKey}:
    parameters:
      - $ref: '#/components/parameters/BehaviorIdempotencyKey'
    get:
      operationId: getRequestDiagnostic
      summary: Read workspace-scoped delivery and mutation counts
      tags: [Test controls]
      responses:
        '200':
          description: Diagnostic counts for one idempotency key.
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/RequestDiagnostic
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    demoWorkspace:
      type: http
      scheme: bearer
      bearerFormat: <workspace UUID>.<base64url secret>
      description: Client-generated capability registered through `/demo-workspaces`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Operation UUID. Unique within the active workspace.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the entity version, for example `"3"`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TravelDayId:
      name: travelDayId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PlaceVisitId:
      name: placeVisitId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DayReflectionId:
      name: dayReflectionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TripFilter:
      name: tripId
      in: query
      required: false
      description: Restrict travel days to one trip.
      schema:
        type: integer
        minimum: 1
    TravelDayFilter:
      name: travelDayId
      in: query
      required: false
      description: Restrict place visits to one travel day.
      schema:
        type: integer
        minimum: 1
    PlaceVisitFilter:
      name: placeVisitId
      in: query
      required: false
      description: Restrict child records to one place visit.
      schema:
        type: integer
        minimum: 1
    BehaviorIdempotencyKey:
      name: idempotencyKey
      in: path
      required: true
      description: Operation UUID whose behavior should be removed.
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: Strong entity version tag, for example `"3"`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyReplayed:
      description: Present and true when the stored response was replayed.
      schema:
        type: boolean
    Location:
      description: Relative URL of the created entity.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the client should retry.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed request, header, query, or path value.
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.json#/$defs/ProblemDetails
    Unauthorized:
      description: Workspace capability missing, invalid, or expired.
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.json#/$defs/ProblemDetails
    NotFound:
      description: Resource does not exist in the active workspace.
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.json#/$defs/ProblemDetails
    Conflict:
      description: Domain conflict or incompatible idempotency-key reuse.
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.json#/$defs/ProblemDetails
    PreconditionFailed:
      description: The If-Match header does not match the current entity version.
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.json#/$defs/ProblemDetails
    ValidationFailed:
      description: Structurally valid request violates field or domain validation.
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.json#/$defs/ProblemDetails
    TooManyRequests:
      description: Workspace or origin rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.json#/$defs/ProblemDetails
    ServerError:
      description: Unexpected server failure.
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.json#/$defs/ProblemDetails
